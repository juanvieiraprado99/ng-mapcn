name: Basemaps

# The e2e suite runs offline against copies of the basemap styles, so it cannot notice a provider
# changing its schema. This checks the live styles once a week; a failure means the defaults, the
# e2e fixtures and the docs need an update.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm run check:basemaps
