name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs['projects/ng-mapcn--release_created'] }}
      tag_name: ${{ steps.release.outputs['projects/ng-mapcn--tag_name'] }}
      version: ${{ steps.release.outputs['projects/ng-mapcn--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # No id-token here: dependency install scripts never run with publish rights.
    permissions:
      contents: read
    outputs:
      publish_tag: ${{ steps.tags.outputs.publish_tag }}
      also_latest: ${{ steps.tags.outputs.also_latest }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:lib:prod

      - name: Verify the built version matches the release
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          BUILT=$(node -p "require('./dist/ng-mapcn/package.json').version")
          if [ "$BUILT" != "$RELEASE_VERSION" ]; then
            echo "Built version $BUILT does not match release version $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Decide dist-tags
        id: tags
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/npm-dist-tags.mjs "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ng-mapcn-dist
          path: dist/ng-mapcn
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, no npm ci and no cache: this job only publishes the built artifact.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (publish) and >= 11.21.0 (dist-tag).
      - name: Update npm
        run: |
          npm install -g npm@11.21.1
          npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ng-mapcn-dist
          path: dist/ng-mapcn

      - name: Publish to npm
        working-directory: dist/ng-mapcn
        env:
          PUBLISH_TAG: ${{ needs.build.outputs.publish_tag }}
        run: npm publish --access public --provenance --tag "$PUBLISH_TAG"

      - name: Point latest at this prerelease
        if: needs.build.outputs.also_latest == 'true'
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: npm dist-tag add "ng-mapcn@$RELEASE_VERSION" latest

      - name: Show dist-tags
        run: npm view ng-mapcn dist-tags
